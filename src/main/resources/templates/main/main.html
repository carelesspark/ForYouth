<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{/layout/layout :: setContent(~{this::content})}">
<main class="main_container" th:fragment="content">
    <div class="main_box">
        <h1>임시 메인 페이지</h1>
        <p class="subtitle">임시 메인 페이지입니다:)</p>

        <div th:if="${isLogin}">
            <p th:text="|${email} 님, 환영합니다!|"></p>
        </div>

        <div th:unless="${isLogin}">
            <p>로그인이 필요합니다.</p>
            <button class="login_button" th:onclick="|location.href='@{/login/loginMain}'|">로그인</button>
        </div>
    </div>
</main>
</th:block>
</html>
