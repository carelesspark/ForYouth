<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{/layout/layout :: setContent(~{this::content})}">
<main class="main-container" th:fragment="content">
    <div class="top-section">
        <!-- 왼쪽 영역 -->
        <section class="left-section">
            <!-- 구름 + 문구 -->
            <div class="intro">
                <h1 class="main-title">청년을 위한 정보들을</h1>
                <h1 class="sub-title"><span>한번에!</span></h1>
                <p>For Youth, For Future</p>
            </div>

            <!-- 공지사항 -->
            <div class="notice-board">
                <h2>📢 공지사항</h2>
                <ul>
                    <li><span>29</span> 전체적인 업데이트 소식이 있습니다. <em>관리자</em></li>
                    <li><span>28</span> 전체적인 업데이트 소식이 있습니다. <em>관리자</em></li>
                    <li><span>27</span> 전체적인 업데이트 소식이 있습니다. <em>관리자</em></li>
                    <li><span>26</span> 전체적인 업데이트 소식이 있습니다. <em>관리자</em></li>
                    <li><span>25</span> 전체적인 업데이트 소식이 있습니다. <em>관리자</em></li>
                    <!-- ... -->
                </ul>
            </div>
        </section>

        <!-- 오른쪽 영역 -->
        <section class="right-section">
            <div class="policy-title">1. 청년들을 위한 정책이당!</div>
            <h2>ForYouth 지역 선택</h2>
            <div class="region-grid-div">
                <div class="region-grid">
                    <!-- 반복되는 지역 버튼 -->
                    <button>서울</button>
                    <button>경기</button>
                    <button>강원</button>
                    <!-- ... -->
                </div>
                <div class="region-grid">
                    <!-- 반복되는 지역 버튼 -->
                    <button>인천</button>
                    <button>충청</button>
                    <button>경상</button>
                    <!-- ... -->
                </div>
                <div class="region-grid">
                    <!-- 반복되는 지역 버튼 -->
                    <button>대전</button>
                    <button>세종</button>
                    <button>울산</button>
                    <!-- ... -->
                </div>
                <div class="region-grid">
                    <!-- 반복되는 지역 버튼 -->
                    <button>전라</button>
                    <button>대구</button>
                    <button>부산</button>
                    <!-- ... -->
                </div>
                <div class="region-grid">
                    <!-- 반복되는 지역 버튼 -->
                    <button>광주</button>
                    <button>제주</button>
                    <!-- ... -->
                </div>

            </div>
        </section>
    </div>
    <!-- 하단: 전체 너비 컨텐츠 (ex. 카로셀) -->
    <div class="bottom-section">
        <div id="carouselExampleIndicators" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="4000">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img th:src="@{/images/main/test1.png}" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img th:src="@{/images/main/test2.png}" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img th:src="@{/images/main/test3.png}" class="d-block w-100" alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</main>
</th:block>
</html>
