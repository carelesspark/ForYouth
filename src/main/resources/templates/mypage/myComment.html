<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{/layout/layout :: setContent(~{this::content})}">
    <main class="main-container" th:fragment="content">
        <div class="left-section">
            <div class="user-info menu-style">
                <a th:href="@{/mypage/user}">회원 정보</a>
            </div>
            <div class="community-activity menu-style">
                <a th:href="@{/mypage/post}">커뮤니티 활동</a>
                <div class="sub-menu-style">
                    <div class="my-post">
                        <a th:href="@{/mypage/post}">내가 작성한 게시글</a>
                    </div>
                    <div class="my-comment">
                        <a th:href="@{/mypage/comment}">내가 작성한 댓글</a>
                    </div>
                    <div class="like-post">
                        <a th:href="@{/mypage/like-post}">좋아요 누른 게시글</a>
                    </div>
                    <div class="like-comment">
                        <a th:href="@{/mypage/like-comment}">좋아요 누른 댓글</a>
                    </div>
                </div>
            </div>
            <div class="bookmark menu-style">
                <a th:href="@{/mypage/bookmark}">즐겨찾기 목록</a>
            </div>
            <div class="latest-info menu-style">
                <a th:href="@{/mypage/latest-info}">최근 본 정보</a>
            </div>
            <div class="question-answer">
                <a th:href="@{/mypage/qna}">ForYouth Q&A</a>
            </div>
        </div>
        <div class="right-section">
            <div class="container">
                <div class="card">
                    <h3>✏ 내가 작성한 댓글</h3>
                    <p>댓글 &nbsp;<span th:text="${count}"></span></p>
                    <div class="option-box">
                        <form method="get" th:action="@{/mypage/comment}">
                            <input type="hidden" name="period" id="periodInput" th:value="${period}"/>
                            <div class="date-buttons">
                                <button type="button" data-months="0"
                                        th:classappend="${period} == '0' ? 'active' : ''">오늘
                                </button>
                                <button type="button" data-months="1"
                                        th:classappend="${period} == '1' ? 'active' : ''">1개월
                                </button>
                                <button type="button" data-months="3"
                                        th:classappend="${period} == '3' ? 'active' : ''">3개월
                                </button>
                                <button type="button" data-months="6"
                                        th:classappend="${period} == '6' ? 'active' : ''">6개월
                                </button>
                                <button type="button" data-months="12"
                                        th:classappend="${period} == '12' ? 'active' : ''">1년
                                </button>
                                <button type="button" data-months="36"
                                        th:classappend="${period} == '36' ? 'active' : ''">3년
                                </button>
                            </div>

                            <div class="filter">
                                <input type="date" name="startDate" id="startDate"
                                       th:value="${startDate != null} ? ${#temporals.format(startDate, 'yyyy-MM-dd')} : ''"/>
                                <input type="date" name="endDate" id="endDate"
                                       th:value="${endDate != null} ? ${#temporals.format(endDate, 'yyyy-MM-dd')} : ''"/>
                                <input type="text" name="keyword" th:value="${keyword}" placeholder="댓글 내용"/>
                                <button type="submit">검색</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card">
                    <div class="comment-wrapper">
                        <table class="comment-table">
                            <thead>
                            <tr>
                                <th class="center" style="width: 40px;">번호</th>
                                <th>댓글</th>
                                <th class="center" style="width: 160px;">댓글단 글</th>
                                <th class="center" style="width: 80px;">작성일</th>
                                <th class="center" style="width: 60px;">좋아요 수</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${commentPage.content.isEmpty()}">
                                <td colspan="5" class="center">작성한 댓글이 없습니다 :)</td>
                            </tr>
                            <tr th:each="comment, stat : ${commentPage.content}">
                                <td th:text="${commentPage.totalElements - (commentPage.number * commentPage.size + stat.index)}" class="center"></td>
                                <td th:text="${comment.comment}" class="center"></td>
                                <td class="comment-title"><a href="#" th:text="${comment.postTitle}"></a></td>
                                <td th:text="${#temporals.format(comment.regDate, 'yyyy-MM-dd')}" class="center"></td>
                                <td th:text="${comment.likeCount}" class="center"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" th:if="${commentPage.totalPages > 0}">
                        <a th:if="${commentPage.hasPrevious()}"
                           th:href="@{/mypage/comment(period=${period}, page=${commentPage.number - 1}, keyword=${keyword}, startDate=${startDate}, endDate=${endDate})}">
                            &lt; 이전
                        </a>

                        <span th:each="i : ${#numbers.sequence(1, commentPage.totalPages)}">
                            <a th:href="@{/mypage/comment(period=${period}, page=${i}, keyword=${keyword}, startDate=${startDate}, endDate=${endDate})}"
                               th:text="${i}"
                               th:class="${i - 1 == commentPage.number} ? 'active' : ''"></a>
                        </span>

                        <a th:if="${commentPage.hasNext()}"
                           th:href="@{/mypage/comment(period=${period}, page=${commentPage.number + 1}, keyword=${keyword}, startDate=${startDate}, endDate=${endDate})}">
                            다음 &gt;
                        </a>
                    </div>
                </div>
                <div></div>
            </div>
        </div>
    </main>
</th:block>
</html>
