<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:replace="~{/layout/layout :: setContent(~{this::content})}">
    <main class="main-container" th:fragment="content">
        <div class="left-section">
            <div class="user-info menu-style">
                <a th:href="@{/mypage/user}">회원 정보</a>
            </div>
            <div class="community-activity menu-style">
                <a th:href="@{/mypage/post}">커뮤니티 활동</a>
                <div class="sub-menu-style">
                    <div class="my-post">
                        <a th:href="@{/mypage/post}">내가 작성한 게시글</a>
                    </div>
                    <div class="my-comment">
                        <a th:href="@{/mypage/comment}">내가 작성한 댓글</a>
                    </div>
                    <div class="like-post">
                        <a th:href="@{/mypage/like-post}">좋아요 누른 게시글</a>
                    </div>
                    <div class="like-comment">
                        <a th:href="@{/mypage/like-comment}">좋아요 누른 댓글</a>
                    </div>
                </div>
            </div>
            <div class="bookmark menu-style">
                <a th:href="@{/mypage/bookmark}">즐겨찾기 목록</a>
            </div>
            <div class="latest-info menu-style">
                <a th:href="@{/mypage/latest-info}">최근 본 정보</a>
            </div>
            <div class="question-answer">
                <a th:href="@{/mypage/qna}">ForYouth Q&A</a>
            </div>
        </div>
        <div class="right-section">
            <div class="container">
                <div class="card">
                    <h3>✏ 즐겨찾기 목록</h3>
                    <p>즐겨찾기 &nbsp;<span th:text="${count}"></span></p>
                    <div class="category-box">
                        <div class="category-buttons">
                            <button class="category-btn" data-category="">전체</button>
                            <button class="category-btn" data-category="EDUCATION">교육/자격증</button>
                            <button class="category-btn" data-category="EMPLOYMENT_SUPPORT">취업지원</button>
                            <button class="category-btn" data-category="FINANCIAL_SUPPORT">금융지원</button>
                            <button class="category-btn" data-category="HOUSING_SUPPORT">주거지원</button>
                            <button class="category-btn" data-category="LOCAL_NEWS">지역소식</button>
                            <button class="category-btn" data-category="WELFARE_BENEFIT">복지혜택</button>
                        </div>
                    </div>
                </div>
                <div id="bookmarkFragment" th:fragment="bookmarkFragment">
                    <div class="card">
                        <div class="bookmark-wrapper">
                            <table class="bookmark-table">
                                <thead>
                                <tr>
                                    <th class="center" style="width: 40px;">번호</th>
                                    <th class="center" style="width: 80px;">카테고리</th>
                                    <th>제목</th>
                                    <th class="center" style="width: 100px;">작성자</th>
                                    <th class="center" style="width: 80px;">작성일</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${bookmark.content.isEmpty()}">
                                    <td colspan="5" class="center">즐겨찾기한 게시글이 없습니다 :)</td>
                                </tr>
                                <tr th:each="post, stat : ${bookmark.content}">
                                    <td th:text="${bookmark.totalElements - (bookmark.number * bookmark.size + stat.index)}"
                                        class="center"></td>
                                    <td th:text="${post.category}" class="center"></td>
                                    <td class="post-title"><a href="#" th:text="${post.title}"></a></td>
                                    <td th:text="${post.writerId}" class="center"></td>
                                    <td th:text="${#temporals.format(post.regDate, 'yyyy-MM-dd')}"
                                        class="center"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination" th:if="${bookmark.totalPages > 0}">
                            <a th:if="${bookmark.hasPrevious()}" class="page-link" th:data-page="${bookmark.number}">&lt; 이전</a>

                            <span th:each="i : ${#numbers.sequence(1, bookmark.totalPages)}">
                                <a class="page-link" th:data-page="${i}" th:text="${i}" th:classappend="${i == bookmark.number + 1} ? 'active' : ''"></a>
                            </span>

                            <a th:if="${bookmark.hasNext()}" class="page-link" th:data-page="${bookmark.number + 2}">다음 &gt;</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</th:block>
</html>
