<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForYouth 회원가입</title>
    <link th:href="@{/css/main/mainTest.css}" rel="stylesheet" type="text/css"/>
</head>
<body>
<main class="main_container">
    <div class="main_box">
        <h1>임시 메인 페이지</h1>
        <p class="subtitle">임시 메인 페이지입니다:)</p>

        <div th:if="${isLogin}">
            <p th:text="|${email} 님, 환영합니다!|"></p>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout_button">로그아웃</button>
            </form>
        </div>

        <div th:unless="${isLogin}">
            <p>로그인이 필요합니다.</p>
            <button class="login_button" th:onclick="|location.href='@{/login/loginMain}'|">로그인</button>
        </div>

    </div>
</main>
</body>
</html>
