<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header id="header" class="header" th:fragment="header">
    <div class="header_inner">
        <div class="logo">로고</div>

        <nav class="nav_menu">
            <a href="#">취업지원</a>
            <a href="#">주거지원</a>
            <a href="#">금융지원</a>
            <a href="#">복지혜택</a>
            <a href="#">교육/자격증</a>
            <a href="#">지역소식</a>
            <a href="#">커뮤니티</a>
            <a th:href="@{/mypage/user}" th:if="${isLogin}">마이페이지</a>
        </nav>

        <div class="header_buttons">
            <form th:action="@{/logout}" method="post" th:if="${isLogin}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout_btn">로그아웃</button>
            </form>
            <button class="login_btn" th:unless="${isLogin}" th:onclick="|location.href='@{/login/loginMain}'|">로그인</button>
        </div>
    </div>
</header>
</body>
</html>
